# Maps proxy model_key → operator-declared file (REQUIRED path) +
# OPTIONAL sampling_source. The scanner reads the GGUF header for technical
# facts (architecture, context_window) and optionally fetches sampling_source
# for recommended sampling parameters (temperature, top_p). sampling_source
# can be any HTTP(S) URL (HF model card, vendor docs, blog post) or a local
# file path. If omitted or unparseable, intent defaults fill in.
#
# model_keys MUST match the proxy's ROUTE_MAP in routing.py:
#   CHAT→chatter, TOOL→professional, CODE→professional, SCHOLAR→scholar,
#   CREATIVE→creative, ARCHITECT→architect
#   (frontdesk is a CPU agent role, not in ROUTE_MAP but still needs
#    an entry for R17 profile resolution)
models:
  architect:
    path: <KINVER_HOME>/models/Architect.gguf
  coder:
    path: <KINVER_HOME>/models/Coder.gguf
  professional:
    path: <KINVER_HOME>/models/Professional.gguf
  creative:
    path: <KINVER_HOME>/models/Creative.gguf
  scholar:
    path: <KINVER_HOME>/models/Scholar.gguf
  chatter:
    path: <KINVER_HOME>/models/Lifeboat.gguf
  frontdesk:
    path: <KINVER_HOME>/models/Front-Desk.gguf
