# Maps proxy model_key → operator-declared file (REQUIRED path) +
# OPTIONAL sampling_source. The scanner reads the GGUF header for technical
# facts (architecture, context_window) and optionally fetches sampling_source
# for recommended sampling parameters (temperature, top_p). sampling_source
# can be any HTTP(S) URL (HF model card, vendor docs, blog post) or a local
# file path. If omitted or unparseable, intent defaults fill in.
#
# This is a worked example of the two paths:
#   - reasoning:  declares sampling_source (the HF README has usable
#                 sampling recommendations; the operator opted in).
#   - architect:  omits sampling_source (the HF model is gated; intent
#                 defaults cover the row without a wasted 401 fetch).
models:
  reasoning:
    path: ~/kinver-hub/models/Planner-Auditor.gguf
    sampling_source: https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Llama-8B/raw/main/README.md
  architect:
    path: ~/kinver-hub/models/Architect.gguf
